<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch A1 + A2 — Spickzettel</title>
<style>
  :root{
    --paper:#f2ede2;
    --ink:#26241f;
    --ink-soft:#5c584d;
    --rule:#d8cfba;
    --card:#fbf9f3;

    --nom:#8a6d3b;
    --nom-bg:#f4e9d3;
    --akk:#a2453a;
    --akk-bg:#f6e0dc;
    --dat:#3a6b62;
    --dat-bg:#dceae5;
    --gen:#5a5490;
    --gen-bg:#e4e1f2;

    --masc:#2f5fa3;
    --masc-bg:#dbe6f5;
    --fem:#a2293a;
    --fem-bg:#f6dde1;
    --neut:#3d7a4a;
    --neut-bg:#dcefdf;
    --plur:#9a7c1f;
    --plur-bg:#f5eec9;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    line-height:1.5;
    padding-bottom:60px;
  }

  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--rule);
  }
  header h1{
    font-size:1.5rem;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:0.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.92rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }

  nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 20px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    border-bottom:1px solid var(--rule);
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:10;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:0.82rem;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--rule);
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  nav button.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  main{
    padding:22px 20px 10px;
    max-width:640px;
    margin:0 auto;
  }

  .sheet{display:none;}
  .sheet.active{display:block;animation:fade 0.25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .sheet h2{
    font-size:1.25rem;
    margin:0 0 6px;
  }
  .sheet .sub{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink-soft);
    font-size:0.88rem;
    margin:0 0 20px;
  }
  .stamp{
    display:inline-block;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:5px;
    padding:2px 7px;
    margin-left:8px;
    vertical-align:middle;
  }

  .card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:14px 16px 16px;
    margin-bottom:14px;
  }
  .card h3{
    font-size:0.96rem;
    margin:0 0 8px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-weight:700;
  }
  .card p.note{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin:8px 0 0;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:0.86rem;
  }
  th,td{
    text-align:left;
    padding:5px 7px;
    border-bottom:1px solid var(--rule);
  }
  th{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    font-weight:600;
  }
  tr:last-child td{border-bottom:none;}

  .nom{background:var(--nom-bg);color:var(--nom);}
  .akk{background:var(--akk-bg);color:var(--akk);}
  .dat{background:var(--dat-bg);color:var(--dat);}
  .gen{background:var(--gen-bg);color:var(--gen);}
  .nom td,.nom th{color:var(--nom);}
  .akk td,.akk th{color:var(--akk);}
  .dat td,.dat th{color:var(--dat);}
  .gen td,.gen th{color:var(--gen);}

  .masc{background:var(--masc-bg);color:var(--masc);}
  .fem{background:var(--fem-bg);color:var(--fem);}
  .neut{background:var(--neut-bg);color:var(--neut);}
  .plur{background:var(--plur-bg);color:var(--plur);}
  .masc td,.masc th{color:var(--masc);}
  .fem td,.fem th{color:var(--fem);}
  .neut td,.neut th{color:var(--neut);}
  .plur td,.plur th{color:var(--plur);}

  .pill-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:6px;
  }
  .pill{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:0.76rem;
    font-weight:600;
    padding:4px 9px;
    border-radius:6px;
    background:var(--card);
    border:1px solid var(--rule);
  }

  .flow{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:0.88rem;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    background:var(--card);
    border:1px dashed var(--rule);
    border-radius:8px;
    padding:10px;
    margin-top:6px;
  }
  .flow span{
    padding:4px 9px;
    border-radius:6px;
    background:var(--paper);
    border:1px solid var(--rule);
  }
  .flow .arrow{border:none;background:none;padding:0;color:var(--ink-soft);}

  .footnote{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:0.78rem;
    color:var(--ink-soft);
    text-align:center;
    margin-top:30px;
  }

  @media print{
    body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding-bottom:0;}
    nav{display:none !important;}
    header{padding:0 0 10px;border-bottom:2px solid var(--ink);}
    header p{display:none;}
    main{padding:10px 0 0;max-width:100%;}
    .footnote{display:none;}
    .sheet{display:none !important;}
    .sheet.active{
      display:block !important;
      column-count:2;
      column-gap:22px;
    }
    .sheet.active h2,
    .sheet.active > .sub,
    .card.wide{
      -webkit-column-span:all;
      column-span:all;
    }
    .card.wide table{font-size:0.62rem;}
    .card.wide th,.card.wide td{padding:2px 4px;}
    .sheet h2{font-size:1.05rem;margin-top:0;}
    .stamp{font-size:0.6rem;padding:1px 5px;}
    .sheet .sub{margin-bottom:10px;font-size:0.76rem;}
    .card{
      break-inside:avoid;
      -webkit-column-break-inside:avoid;
      page-break-inside:avoid;
      padding:7px 9px 9px;
      margin-bottom:8px;
    }
    .card h3{font-size:0.8rem;margin-bottom:5px;}
    .card table{font-size:0.68rem;}
    .card th,.card td{padding:2px 4px;}
    .card .note{font-size:0.64rem;margin-top:5px;}
    .flow{padding:6px;font-size:0.68rem;}
    .pill{font-size:0.64rem;padding:2px 6px;}
  }

  .lvl{display:inline-block;font-size:.62rem;font-weight:800;border-radius:4px;padding:1px 5px;margin-right:5px;color:#fff;background:#3a6b62}
  .lvl.a2{background:#a2453a}
  .mt{table-layout:fixed;text-align:center;font-size:.6rem}.mt td,.mt th{padding:4px 0 !important;overflow:hidden}
  .mt th{background:#4fc3e8;color:#0b2a40;text-align:center;text-transform:none;letter-spacing:0;font-size:.6rem;border:1px solid #fff}
  .mt td{background:#8fdcf2;color:#0b2a40;font-weight:700;text-align:center;border:1px solid #fff;padding:4px 1px}
  .mt td.l{background:#e6e6e6;text-align:right;color:#333;font-weight:600}
  .mt td.s{background:#c9eefa;font-weight:600}
  .oe{color:#e07b00}
  .pq th{background:#4a9bb0;color:#fff;text-transform:none;letter-spacing:0}
  .pq td{background:#3b5f5c;color:#fff;font-weight:700;border-bottom:2px solid var(--card)}
  .pq td:last-child{background:#dfeeee;color:#234;font-weight:600}
  .big td{font-size:.8rem}
  td.m{background:var(--masc-bg);color:var(--masc)}td.f{background:var(--fem-bg);color:var(--fem)}td.n{background:var(--neut-bg);color:var(--neut)}td.p{background:var(--plur-bg);color:var(--plur)}
  .tw{overflow-x:auto}
  b.e{color:var(--akk)}
</style>
</head>
<body>

<header>
  <h1>Deutsch A1 + A2 — Spickzettel</h1>
  <p>Quick reference, A1 basics + A2 — tap a tab · <a href="index.html" style="color:inherit">← Zur Hütte</a></p>
</header>

<nav id="tabs"></nav>

<main id="sheets"></main>

<p class="footnote">Viel Erfolg.</p>

<script src="modules/irregular-47/verbs.js"></script>
<script src="modules/cafe/menu.js"></script>
<script>
const U="13 Nov 2026";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const irr=()=> "<div class='card wide'><h3>Top 47 irregular verbs (er/sie/es)</h3><div class='tw'><table><tr><th>Infinitiv</th><th>English</th><th>Präsens</th><th>Präteritum</th><th>Perfekt</th></tr>"+
  (window.VERBS||[]).map(v=>"<tr><td><b>"+esc(v[0])+"</b></td><td>"+esc(v[1])+"</td><td>"+esc(v[2])+"</td><td>"+esc(v[3]||"–")+"</td><td>"+esc(v[4]?v[4][0]:"–")+"</td></tr>").join("")+"</table></div><p class='note'>From your “47 Samurai” PDF. – = not given there. möchten has no own Präteritum (use wollte/mochte).</p></div>";
const cafe=()=> "<div class='card'><h3>What you ask (Sie)</h3><table>"+(window.CAFE?CAFE.ask.map(p=>"<tr><td>"+esc(p.en)+"</td><td><b>"+esc(p.a[0])+"</b></td></tr>").join(""):"")+"</table></div>"+
  "<div class='card'><h3>What customers ask → your answer</h3><table>"+(window.CAFE?CAFE.reply.map(p=>"<tr><td>“"+esc(p.q)+"”</td><td><b>"+esc(p.a[0])+"</b></td></tr>").join(""):"")+"</table></div>"+
  "<div class='card'><h3>What customers say</h3><table><tr><td>Ich hätte gern einen Cappuccino, bitte.</td><td>I'd like a cappuccino</td></tr><tr><td>Einen Flat White mit Hafermilch, zum Mitnehmen.</td><td>A flat white with oat milk, to go</td></tr><tr><td>Ich nehme eine heiße Schokolade.</td><td>I'll take a hot chocolate</td></tr><tr><td>Für mich einen Chai Latte, bitte.</td><td>A chai latte for me</td></tr><tr><td>Was kostet das? / Zahlen, bitte.</td><td>How much? / The bill, please</td></tr></table><p class='note'>Order = Akkusativ: der → <b>einen</b>, die → <b>eine</b>, das → <b>ein</b>. Prices: 4,90 € = vier Euro neunzig.</p></div>"+
  "<div class='card'><h3>Menu words</h3><table>"+(window.CAFE?CAFE.vocab.map(p=>"<tr><td>"+esc(p[0])+"</td><td>"+esc(p[1][0])+"</td></tr>").join(""):"")+"</table></div>";
const data=[
{id:"cases",label:"A1 · Fälle",title:"Pronomen & Artikel",sub:"Personal pronouns, der-words, ein-words — the case system in three tables",html:`
 <div class="card"><h3>Personalpronomen</h3><table><tr><th>Nom.</th><th class="akk">Akk.</th><th class="dat">Dat.</th></tr>
  <tr><td>ich</td><td>mich</td><td>mir</td></tr><tr><td>du</td><td>dich</td><td>dir</td></tr><tr><td>er</td><td>ihn</td><td>ihm</td></tr><tr><td>sie</td><td>sie</td><td>ihr</td></tr><tr><td>es</td><td>es</td><td>ihm</td></tr>
  <tr><td>wir</td><td>uns</td><td>uns</td></tr><tr><td>ihr</td><td>euch</td><td>euch</td></tr><tr><td>sie/Sie</td><td>sie/Sie</td><td>ihnen/Ihnen</td></tr></table></div>
 <div class="card"><h3>der-words — der/dieser/welcher</h3><table><tr><th></th><th class="nom">Nom.</th><th class="akk">Akk.</th><th class="dat">Dat.</th></tr>
  <tr class="masc"><td>m</td><td>der</td><td>den</td><td>dem</td></tr><tr class="fem"><td>f</td><td>die</td><td>die</td><td>der</td></tr><tr class="neut"><td>n</td><td>das</td><td>das</td><td>dem</td></tr><tr class="plur"><td>pl</td><td>die</td><td>die</td><td>den(+n)</td></tr></table>
  <p class="note">dieser/welcher: same endings (dieser/diesen/diesem).</p></div>
 <div class="card"><h3>ein-words — ein/kein/mein/dein/sein/ihr/unser/euer/Ihr</h3><table><tr><th></th><th class="nom">Nom.</th><th class="akk">Akk.</th><th class="dat">Dat.</th></tr>
  <tr class="masc"><td>m</td><td>ein</td><td>ein<b>en</b></td><td>ein<b>em</b></td></tr><tr class="fem"><td>f</td><td>ein<b>e</b></td><td>ein<b>e</b></td><td>ein<b>er</b></td></tr><tr class="neut"><td>n</td><td>ein</td><td>ein</td><td>ein<b>em</b></td></tr><tr class="plur"><td>pl (kein/mein…)</td><td>-e</td><td>-e</td><td>-en</td></tr></table>
  <p class="note">ein has no plural. euer drops its e: eure. Café: <b>einen</b> Kaffee, <b>eine</b> Tasse, <b>ein</b> Croissant.</p></div>
 <div class="card"><h3>Dativ-Verben (A2)</h3><p class="pill-row dat"><span class="pill">helfen</span><span class="pill">gefallen</span><span class="pill">gehören</span><span class="pill">schmecken</span><span class="pill">danken</span><span class="pill">antworten</span><span class="pill">passen</span><span class="pill">fehlen</span><span class="pill">gratulieren</span><span class="pill">zuhören</span></p>
  <p class="note">Das Essen schmeckt <b>mir</b>. Wie geht es <b>Ihnen</b>? Das Buch gehört <b>mir</b>. Ich helfe <b>dir</b>.</p></div>`},
{id:"gender",label:"A1 · Genus",title:"Genus & Plural",sub:"Endings that predict der/die/das, and how plurals form",html:`
 <div class="card"><h3>Predicting gender by ending</h3><table><tr><th class="masc">der</th><th class="fem">die</th><th class="neut">das</th></tr><tr><td>-er, -en, -or, -ig/-ich, -ling</td><td>-e, -heit/-keit, -ung, -schaft, -tion/-sion, -in, -ie/-ei</td><td>-chen/-lein, -um, -ment, -o, ge-</td></tr></table><p class="note">Compounds: last word decides (die Zeit + der Punkt → der Zeitpunkt).</p></div>
 <div class="card"><h3>Plural patterns</h3><table><tr><th>Pattern</th><th>Example</th></tr><tr><td>+e (± Umlaut)</td><td>der Tisch → die Tische; der Stuhl → die Stühle</td></tr><tr><td>+er + Umlaut</td><td>das Buch → die Bücher</td></tr><tr><td>+n/+en</td><td>die Frau → die Frauen</td></tr><tr><td>+s (loanwords)</td><td>das Auto → die Autos</td></tr><tr><td>no change</td><td>der Lehrer → die Lehrer</td></tr></table></div>`},
{id:"praesens",label:"A1 · Präsens",title:"Präsens (present tense)",sub:"Endings, sein/haben/werden, stem-changers, separable verbs",html:`
 <div class="card"><h3>Regular endings (stem = infinitive − en)</h3><table><tr><th></th><th>machen</th><th>arbeiten</th><th>sein</th><th>haben</th><th>werden</th></tr>
  <tr><td>ich</td><td>mach<b class="e">e</b></td><td>arbeit<b class="e">e</b></td><td>bin</td><td>habe</td><td>werde</td></tr><tr><td>du</td><td>mach<b class="e">st</b></td><td>arbeit<b class="e">est</b></td><td>bist</td><td>hast</td><td>wirst</td></tr>
  <tr><td>er/sie/es</td><td>mach<b class="e">t</b></td><td>arbeit<b class="e">et</b></td><td>ist</td><td>hat</td><td>wird</td></tr><tr><td>wir</td><td>mach<b class="e">en</b></td><td>arbeiten</td><td>sind</td><td>haben</td><td>werden</td></tr>
  <tr><td>ihr</td><td>mach<b class="e">t</b></td><td>arbeit<b class="e">et</b></td><td>seid</td><td>habt</td><td>werdet</td></tr><tr><td>sie/Sie</td><td>machen</td><td>arbeiten</td><td>sind</td><td>haben</td><td>werden</td></tr></table>
  <p class="note">Stems ending in -t/-d (or consonant + m/n) add an e: arbeitest, arbeitet, öffnet.</p></div>
 <div class="card"><h3>Stem-changers (du & er/sie/es only)</h3><table><tr><th>Change</th><th>Verbs</th></tr>
  <tr><td>e → i</td><td>essen: du isst, er isst · geben: gibt · sprechen: spricht · nehmen: du nimmst, er nimmt · helfen: hilft</td></tr>
  <tr><td>e → ie</td><td>sehen: siehst, sieht · lesen: liest · empfehlen: empfiehlt</td></tr>
  <tr><td>a → ä</td><td>fahren: fährst, fährt · schlafen: schläft · laufen: läuft · tragen: trägt</td></tr></table></div>
 <div class="card"><h3>Trennbare Verben (separable)</h3><table><tr><td>aufstehen</td><td>Ich <b>stehe</b> um 7 Uhr <b>auf</b>.</td></tr><tr><td>einkaufen</td><td>Wir <b>kaufen</b> heute <b>ein</b>.</td></tr><tr><td>anrufen</td><td>Sie <b>ruft</b> mich <b>an</b>.</td></tr></table><p class="note">Prefix goes to the end. With a modal it stays attached at the end: Ich muss um 7 <b>aufstehen</b>.</p></div>`},
{id:"modal",label:"A1 · Modal & Imperativ",title:"Modalverben & Imperativ",sub:"Present-tense modals and commands",html:`
 <div class="card"><h3>Modalverben (Präsens)</h3><table><tr><th></th><th>können</th><th>müssen</th><th>wollen</th><th>dürfen</th><th>sollen</th><th>möchten</th></tr>
  <tr><td>ich/er</td><td>kann</td><td>muss</td><td>will</td><td>darf</td><td>soll</td><td>möchte</td></tr><tr><td>du</td><td>kannst</td><td>musst</td><td>willst</td><td>darfst</td><td>sollst</td><td>möchtest</td></tr>
  <tr><td>wir/sie/Sie</td><td>können</td><td>müssen</td><td>wollen</td><td>dürfen</td><td>sollen</td><td>möchten</td></tr><tr><td>ihr</td><td>könnt</td><td>müsst</td><td>wollt</td><td>dürft</td><td>sollt</td><td>möchtet</td></tr></table>
  <p class="note">can / must / want / may / should / would like. Modal = position 2, infinitive → end.</p></div>
 <div class="card"><h3>Imperativ</h3><table><tr><th>Sie</th><th>du</th><th>ihr</th></tr><tr><td>Kommen Sie!</td><td>Komm!</td><td>Kommt!</td></tr><tr><td>Nehmen Sie!</td><td>Nimm! (e→i)</td><td>Nehmt!</td></tr><tr><td>Fahren Sie!</td><td>Fahr! (no Umlaut)</td><td>Fahrt!</td></tr><tr><td>Seien Sie!</td><td>Sei!</td><td>Seid!</td></tr></table><p class="note">Soften with bitte/doch/mal.</p></div>`},
{id:"prep",label:"A1 · Präpositionen",title:"Präpositionen & Wegbeschreibung",sub:"Which case, the two-way ones, contractions, directions",html:`
 <div class="card"><h3>Fixed case</h3><p class="pill-row akk"><span class="pill">durch</span><span class="pill">für</span><span class="pill">gegen</span><span class="pill">ohne</span><span class="pill">um</span></p><p class="note">Always Akkusativ ↑</p>
  <p class="pill-row dat"><span class="pill">ab</span><span class="pill">aus</span><span class="pill">außer</span><span class="pill">bei</span><span class="pill">mit</span><span class="pill">nach</span><span class="pill">seit</span><span class="pill">von</span><span class="pill">zu</span></p><p class="note">Always Dativ ↑</p></div>
 <div class="card"><h3>Wechselpräpositionen — Wo? (Dat.) / Wohin? (Akk.)</h3><p class="pill-row"><span class="pill">an</span><span class="pill">auf</span><span class="pill">hinter</span><span class="pill">in</span><span class="pill">neben</span><span class="pill">über</span><span class="pill">unter</span><span class="pill">vor</span><span class="pill">zwischen</span></p><p class="note">Motion (wohin) → Akk. Position (wo) → Dat. Ich gehe in die Küche. / Ich bin in der Küche.</p></div>
 <div class="card"><h3>Contractions</h3><table><tr><td>in+das → ins</td><td>an+das → ans</td><td>zu+dem → zum</td></tr><tr><td>in+dem → im</td><td>an+dem → am</td><td>zu+der → zur</td></tr><tr><td>bei+dem → beim</td><td>von+dem → vom</td><td></td></tr></table></div>
 <div class="card"><h3>Wegbeschreibung</h3><table><tr><td>Entschuldigung, ich suche ...</td><td>Excuse me, I'm looking for ...</td></tr><tr><td>Wie komme ich zum/zur ...?</td><td>How do I get to ...?</td></tr><tr><td>geradeaus / nach rechts / nach links</td><td>straight / right / left</td></tr><tr><td>an der Ampel/Kreuzung</td><td>at the light/intersection</td></tr><tr><td>nach 50 Metern abbiegen</td><td>turn after 50 metres</td></tr></table></div>`},
{id:"word",label:"A1 · Satzbau",title:"Satzbau",sub:"Verb position, questions, conjunctions, negation",html:`
 <div class="card"><h3>Verb-second rule</h3><div class="flow"><span>1</span><span class="arrow">·</span><span>Verb (pos. 2)</span><span class="arrow">·</span><span>rest</span></div><p class="note">Whatever is first, the verb is 2nd. Then Time – Manner – Place: Ich fahre morgen mit dem Bus zur Arbeit.</p></div>
 <div class="card"><h3>Questions</h3><table><tr><td>Ja/Nein: verb first</td><td>Trinken Sie Kaffee?</td></tr><tr><td>W-Frage: W-word, verb 2nd</td><td>Was möchten Sie?</td></tr></table><p class="note"><span class="pill">wer who</span> <span class="pill">was what</span> <span class="pill">wann when</span> <span class="pill">wo where</span> <span class="pill">wohin where to</span> <span class="pill">woher from</span> <span class="pill">warum why</span> <span class="pill">wie how</span> <span class="pill">welche(r/s) which</span></p></div>
 <div class="card"><h3>Konjunktionen</h3><table><tr><td>und, oder, aber, denn, sondern</td><td>verb stays pos. 2</td></tr><tr><td>weil, dass, wenn, ob, als, obwohl, bis, damit</td><td>verb → end of clause</td></tr><tr><td>dann, deshalb, trotzdem, also, sonst</td><td>pos. 1, triggers inversion</td></tr></table></div>
 <div class="card"><h3>nicht vs. kein</h3><table><tr><td>kein</td><td>negates a noun with ein/no article</td></tr><tr><td>nicht</td><td>negates verbs, adjectives, or a der/die/das noun</td></tr></table></div>`},
{id:"num",label:"A1 · Zahlen & Zeit",title:"Zahlen, Zeit & Preise",sub:"Numbers, ordinals, telling time, saying prices",html:`
 <div class="card"><h3>Zahlen</h3><table class="big"><tr><td>0 null</td><td>1 eins</td><td>2 zwei</td><td>3 drei</td><td>4 vier</td></tr><tr><td>5 fünf</td><td>6 sechs</td><td>7 sieben</td><td>8 acht</td><td>9 neun</td></tr><tr><td>10 zehn</td><td>11 elf</td><td>12 zwölf</td><td>13 dreizehn</td><td>14 vierzehn</td></tr><tr><td>15 fünfzehn</td><td>16 sechzehn</td><td>17 siebzehn</td><td>18 achtzehn</td><td>19 neunzehn</td></tr><tr><td>20 zwanzig</td><td>30 dreißig</td><td>40 vierzig</td><td>50 fünfzig</td><td>60 sechzig</td></tr><tr><td>70 siebzig</td><td>80 achtzig</td><td>90 neunzig</td><td>100 hundert</td><td>1000 tausend</td></tr></table><p class="note">21 = einundzwanzig (ones before tens). 16 sechzehn, 17 siebzehn lose letters.</p></div>
 <div class="card"><h3>Preise</h3><table><tr><td>4,90 €</td><td>vier Euro neunzig</td></tr><tr><td>12,50 €</td><td>zwölf Euro fünfzig</td></tr><tr><td>3,80 €</td><td>drei Euro achtzig</td></tr><tr><td>5,00 €</td><td>fünf Euro</td></tr></table><p class="note">Short form: “vier neunzig”. 1 € = ein Euro. Change = das Rückgeld.</p></div>
 <div class="card"><h3>Ordnungszahlen</h3><table><tr><td>1.–19.</td><td>Zahl + -te (vierte, siebte)</td></tr><tr><td>20.+</td><td>Zahl + -ste (zwanzigste)</td></tr><tr><td>irregular</td><td>erste, dritte, siebte, achte</td></tr></table><p class="note">Dates: Der Wievielte ist heute? Am dreizehnten November.</p></div>
 <div class="card"><h3>Uhrzeit</h3><table><tr><td>Es ist drei Uhr.</td><td>3:00</td></tr><tr><td>Es ist Viertel nach drei.</td><td>3:15</td></tr><tr><td>Es ist halb vier.</td><td>3:30 (toward 4)</td></tr><tr><td>Es ist Viertel vor vier.</td><td>3:45</td></tr></table></div>`},
{id:"comp",label:"A1/A2 · Komparativ",title:"Komparativ & Superlativ",sub:"lang → länger → am längsten, and wie vs. als",html:`
 <div class="card"><h3>Regular</h3><table><tr><th>+</th><th>++ -er</th><th>+++ am -(e)sten</th></tr><tr><td>lang</td><td>länger</td><td>am längsten</td></tr><tr><td>interessant</td><td>interessanter</td><td>am interessantesten</td></tr><tr><td>teuer</td><td>teurer</td><td>am teuersten</td></tr></table><p class="note">-t/-d/-s/-ß/-z add -e- (interessantesten). Short a/o/u often take Umlaut.</p></div>
 <div class="card"><h3>Irregular</h3><table><tr><td>gut</td><td>besser</td><td>am besten</td></tr><tr><td>hoch</td><td>höher</td><td>am höchsten</td></tr><tr><td>nah</td><td>näher</td><td>am nächsten</td></tr><tr><td>viel</td><td>mehr</td><td>am meisten</td></tr><tr><td>gern</td><td>lieber</td><td>am liebsten</td></tr></table></div>
 <div class="card"><h3>wie vs. als</h3><table><tr><td>so + Adj. + wie</td><td>as … as</td></tr><tr><td>Komparativ + als</td><td>than — never “-er wie”</td></tr></table><p class="note">als also means “when” for a one-off past event.</p></div>`},
{id:"perfekt",label:"A2 · Perfekt",title:"Perfekt (present perfect)",sub:"The usual spoken past: haben/sein + Partizip II",html:`
 <div class="card"><h3>Auxiliary (position 2) + Partizip II (end)</h3><table><tr><th></th><th>haben</th><th>sein</th></tr><tr><td>ich</td><td>habe</td><td>bin</td></tr><tr><td>du</td><td>hast</td><td>bist</td></tr><tr><td>er/sie/es</td><td>hat</td><td>ist</td></tr><tr><td>wir</td><td>haben</td><td>sind</td></tr><tr><td>ihr</td><td>habt</td><td>seid</td></tr><tr><td>sie/Sie</td><td>haben</td><td>sind</td></tr></table>
  <p class="note">Ich <b>habe</b> einen Kaffee <b>getrunken</b>. · Wir <b>sind</b> nach Berlin <b>gefahren</b>.</p></div>
 <div class="card"><h3>haben or sein?</h3><table><tr><th>sein</th><th>haben</th></tr><tr><td>movement A→B, change of state, no object (gehen, fahren, kommen, fliegen, aufstehen, einschlafen, werden)</td><td>everything else (default), incl. verbs with an Akkusativ object</td></tr></table><p class="note">Also sein: sein, bleiben, passieren, reisen, wandern, laufen, fallen, sterben.</p></div>
 <div class="card"><h3>Building the Partizip II</h3><table><tr><th>Type</th><th>Pattern</th><th>Example</th></tr>
  <tr><td>weak</td><td>ge- + stem + -t</td><td>machen → gemacht</td></tr><tr><td>stem in -t/-d</td><td>ge- + stem + -et</td><td>arbeiten → gearbeitet</td></tr><tr><td>strong</td><td>ge- + (vowel change) + -en</td><td>trinken → getrunken, gehen → gegangen</td></tr><tr><td>mixed</td><td>ge- + vowel change + -t</td><td>bringen → gebracht, denken → gedacht, wissen → gewusst</td></tr>
  <tr><td>-ieren</td><td>no ge-, + -t</td><td>telefonieren → telefoniert</td></tr><tr><td>inseparable prefix (be-, emp-, ent-, er-, ge-, miss-, ver-, zer-)</td><td>no ge-</td><td>besuchen → besucht, verstehen → verstanden</td></tr><tr><td>separable prefix</td><td>prefix + ge + stem</td><td>aufstehen → aufgestanden, einkaufen → eingekauft</td></tr></table></div>
 <div class="card"><h3>Position</h3><div class="flow"><span>Subjekt</span><span class="arrow">·</span><span>habe/bin</span><span class="arrow">·</span><span>… rest …</span><span class="arrow">·</span><span>Partizip II</span></div><p class="note">In a subordinate clause the auxiliary goes last: …, weil ich Kaffee getrunken <b>habe</b>.</p></div>`},
{id:"prat",label:"A2 · Präteritum",title:"Präteritum & Plusquamperfekt",sub:"Simple past, modals in the past, past perfect",html:`
 <div class="card"><h3>Regular verbs: stem + -te endings</h3><table><tr><th></th><th>machen</th><th>arbeiten</th></tr><tr><td>ich</td><td>mach<b class="e">te</b></td><td>arbeit<b class="e">ete</b></td></tr><tr><td>du</td><td>mach<b class="e">test</b></td><td>arbeit<b class="e">etest</b></td></tr><tr><td>er/sie/es</td><td>mach<b class="e">te</b></td><td>arbeit<b class="e">ete</b></td></tr><tr><td>wir</td><td>mach<b class="e">ten</b></td><td>arbeit<b class="e">eten</b></td></tr><tr><td>ihr</td><td>mach<b class="e">tet</b></td><td>arbeit<b class="e">etet</b></td></tr><tr><td>sie/Sie</td><td>mach<b class="e">ten</b></td><td>arbeit<b class="e">eten</b></td></tr></table>
  <p class="note">Strong verbs change the stem (gehen → ging, sehen → sah); see the irregular list.</p></div>
 <div class="card"><h3>sein · haben · werden</h3><table><tr><th></th><th>sein</th><th>haben</th><th>werden</th></tr><tr><td>ich</td><td>war</td><td>hatte</td><td>wurde</td></tr><tr><td>du</td><td>warst</td><td>hattest</td><td>wurdest</td></tr><tr><td>er/sie/es</td><td>war</td><td>hatte</td><td>wurde</td></tr><tr><td>wir</td><td>waren</td><td>hatten</td><td>wurden</td></tr><tr><td>ihr</td><td>wart</td><td>hattet</td><td>wurdet</td></tr><tr><td>sie/Sie</td><td>waren</td><td>hatten</td><td>wurden</td></tr></table><p class="note">Even in speech, sein/haben/modals are usually Präteritum (Ich war müde. Ich hatte Hunger.). Most other verbs: Perfekt when speaking, Präteritum when writing.</p></div>
 <div class="card wide"><h3>Modal verbs in the Präteritum</h3><table class="mt"><colgroup><col style="width:17%"></colgroup>
  <tr><th></th><th>dürfen</th><th>können</th><th>müssen</th><th>sollen</th><th>wollen</th><th>mögen</th></tr>
  <tr><td class="l">stem</td><td class="s"><i>dürf-</i></td><td class="s"><i>könn-</i></td><td class="s"><i>müss-</i></td><td class="s"><i>soll-</i></td><td class="s"><i>woll-</i></td><td class="s"><i>mög-</i></td></tr>
  <tr><td class="l">past stem change</td><td class="s"><b>ü → u</b></td><td class="s"><b>ö → o</b></td><td class="s"><b>ü → u</b></td><td class="s"><b>–</b></td><td class="s"><b>–</b></td><td class="s"><b>ö → o</b></td></tr>
  <tr><td class="l">ich</td><td>durf<b class="oe">te</b></td><td>konn<b class="oe">te</b></td><td>muss<b class="oe">te</b></td><td>soll<b class="oe">te</b></td><td>woll<b class="oe">te</b></td><td>moch<b class="oe">te</b></td></tr>
  <tr><td class="l">du</td><td>durf<b class="oe">test</b></td><td>konn<b class="oe">test</b></td><td>muss<b class="oe">test</b></td><td>soll<b class="oe">test</b></td><td>woll<b class="oe">test</b></td><td>moch<b class="oe">test</b></td></tr>
  <tr><td class="l">er, sie, es</td><td>durf<b class="oe">te</b></td><td>konn<b class="oe">te</b></td><td>muss<b class="oe">te</b></td><td>soll<b class="oe">te</b></td><td>woll<b class="oe">te</b></td><td>moch<b class="oe">te</b></td></tr>
  <tr><td class="l">wir</td><td>durf<b class="oe">ten</b></td><td>konn<b class="oe">ten</b></td><td>muss<b class="oe">ten</b></td><td>soll<b class="oe">ten</b></td><td>woll<b class="oe">ten</b></td><td>moch<b class="oe">ten</b></td></tr>
  <tr><td class="l">ihr</td><td>durf<b class="oe">tet</b></td><td>konn<b class="oe">tet</b></td><td>muss<b class="oe">tet</b></td><td>soll<b class="oe">tet</b></td><td>woll<b class="oe">tet</b></td><td>moch<b class="oe">tet</b></td></tr>
  <tr><td class="l">Sie, sie</td><td>durf<b class="oe">ten</b></td><td>konn<b class="oe">ten</b></td><td>muss<b class="oe">ten</b></td><td>soll<b class="oe">ten</b></td><td>woll<b class="oe">ten</b></td><td>moch<b class="oe">ten</b></td></tr></table><p class="note">Table you supplied (source: Deutsch Gym).</p></div>
 <div class="card"><h3>Plusquamperfekt (past perfect)</h3><table class="pq"><tr><th>Subject</th><th>Sein / Haben</th><th>Partizip II</th><th>English</th></tr><tr><td>Ich</td><td>hatte</td><td>gekocht</td><td>I had cooked</td></tr><tr><td>Wir</td><td>waren</td><td>gegangen</td><td>we had gone</td></tr><tr><td>Du</td><td>hattest</td><td>gespielt</td><td>you had played</td></tr><tr><td>Mein Hund</td><td>hatte</td><td>gefressen</td><td>my dog had eaten</td></tr></table><p class="note">= hatte / war (Präteritum of haben / sein) + Partizip II. Table you supplied.</p></div>`},
{id:"refl",label:"A2 · Reflexiv",title:"Reflexive Verben",sub:"The pronoun refers back to the subject — Akkusativ or Dativ",html:`
 <div class="card"><h3>Reflexivpronomen</h3><table><tr><th></th><th class="akk">Akkusativ</th><th class="dat">Dativ</th></tr><tr><td>ich</td><td>mich</td><td>mir</td></tr><tr><td>du</td><td>dich</td><td>dir</td></tr><tr><td>er/sie/es</td><td>sich</td><td>sich</td></tr><tr><td>wir</td><td>uns</td><td>uns</td></tr><tr><td>ihr</td><td>euch</td><td>euch</td></tr><tr><td>sie/Sie</td><td>sich</td><td>sich</td></tr></table><p class="note">Only ich and du differ between Akk and Dat. Rule: if there is <b>another Akkusativ object</b> (die Hände, einen Kaffee), the reflexive pronoun is <b>Dativ</b>.</p></div>
 <div class="card"><h3>Common (Akkusativ)</h3><table><tr><td>sich freuen (auf/über)</td><td>Ich freue mich auf das Wochenende.</td></tr><tr><td>sich setzen</td><td>Setzen Sie sich bitte.</td></tr><tr><td>sich treffen (mit)</td><td>Wir treffen uns um acht.</td></tr><tr><td>sich beeilen</td><td>Ich muss mich beeilen.</td></tr><tr><td>sich entschuldigen</td><td>Ich entschuldige mich.</td></tr><tr><td>sich interessieren (für)</td><td>Er interessiert sich für Kunst.</td></tr><tr><td>sich duschen / sich waschen</td><td>Ich dusche mich. / Ich wasche mich.</td></tr><tr><td>sich fühlen</td><td>Wie fühlen Sie sich?</td></tr><tr><td>sich erinnern (an)</td><td>Ich erinnere mich an dich.</td></tr></table></div>
 <div class="card"><h3>With Dativ pronoun</h3><table><tr><td>sich (D) die Hände waschen</td><td>Ich wasche <b>mir</b> die Hände.</td></tr><tr><td>sich (D) die Zähne putzen</td><td>Du putzt <b>dir</b> die Zähne.</td></tr><tr><td>sich (D) etwas kaufen</td><td>Ich kaufe <b>mir</b> einen Kaffee.</td></tr><tr><td>sich (D) etwas ansehen</td><td>Wir sehen <b>uns</b> den Film an.</td></tr><tr><td>sich (D) etwas vorstellen (imagine)</td><td>Das kann ich <b>mir</b> vorstellen.</td></tr><tr><td>sich (D) etwas wünschen</td><td>Ich wünsche <b>mir</b> ein Fahrrad.</td></tr><tr><td>sich (D) wehtun</td><td>Ich habe <b>mir</b> wehgetan.</td></tr></table><p class="note">sich vorstellen with Akk = introduce yourself (Ich stelle <b>mich</b> vor); with Dat = imagine. Perfekt: always haben (Ich habe mich gefreut). Position: Ich habe <b>mich</b> beeilt; in a subordinate clause the pronoun comes right after the subject: …, weil ich <b>mich</b> beeile.</p></div>`},
{id:"adj",label:"A2 · Adjektive",title:"Adjektivendungen",sub:"Adjective before a noun — the ending depends on the article",html:`
 <div class="card"><h3>After der-words (der, dieser, welcher)</h3><table><tr><th></th><th class="masc">m</th><th class="fem">f</th><th class="neut">n</th><th class="plur">pl</th></tr><tr><td class="nom">Nom.</td><td>-e</td><td>-e</td><td>-e</td><td>-en</td></tr><tr><td class="akk">Akk.</td><td>-en</td><td>-e</td><td>-e</td><td>-en</td></tr><tr><td class="dat">Dat.</td><td>-en</td><td>-en</td><td>-en</td><td>-en</td></tr></table><p class="note">der <b>heiße</b> Kaffee · die <b>große</b> Tasse · mit dem <b>kleinen</b> Löffel.</p></div>
 <div class="card"><h3>After ein-words (ein, kein, mein …)</h3><table><tr><th></th><th class="masc">m</th><th class="fem">f</th><th class="neut">n</th><th class="plur">pl</th></tr><tr><td class="nom">Nom.</td><td>-er</td><td>-e</td><td>-es</td><td>-en</td></tr><tr><td class="akk">Akk.</td><td>-en</td><td>-e</td><td>-es</td><td>-en</td></tr><tr><td class="dat">Dat.</td><td>-en</td><td>-en</td><td>-en</td><td>-en</td></tr></table><p class="note">ein <b>starker</b> Kaffee · Ich hätte gern einen <b>großen</b> Cappuccino · ein <b>kleines</b> Croissant.</p></div>
 <div class="card"><h3>No article</h3><table><tr><th></th><th class="masc">m</th><th class="fem">f</th><th class="neut">n</th><th class="plur">pl</th></tr><tr><td class="nom">Nom.</td><td>-er</td><td>-e</td><td>-es</td><td>-e</td></tr><tr><td class="akk">Akk.</td><td>-en</td><td>-e</td><td>-es</td><td>-e</td></tr><tr><td class="dat">Dat.</td><td>-em</td><td>-er</td><td>-em</td><td>-en</td></tr></table><p class="note">frischer Kaffee · mit <b>heißer</b> Milch · <b>frische</b> Brötchen. Trick: the ending shows the case where the article didn't.</p></div>`},
{id:"sub",label:"A2 · Nebensätze & K2",title:"Nebensätze, zu-Infinitiv & Konjunktiv II",sub:"Verb to the end · polite requests",html:`
 <div class="card"><h3>Nebensatz: conjunction sends the verb to the end</h3><table><tr><td>weil (because)</td><td>Ich lerne Deutsch, <b>weil</b> ich in Berlin <b>wohne</b>.</td></tr><tr><td>dass (that)</td><td>Ich glaube, <b>dass</b> er heute <b>kommt</b>.</td></tr><tr><td>wenn (if/whenever)</td><td><b>Wenn</b> es regnet, bleibe ich zu Hause.</td></tr><tr><td>ob (whether)</td><td>Ich weiß nicht, <b>ob</b> er Zeit <b>hat</b>.</td></tr><tr><td>obwohl (although)</td><td>Er arbeitet, <b>obwohl</b> er krank <b>ist</b>.</td></tr></table>
  <p class="note">If the Nebensatz comes first, the main clause starts with its verb: <b>Wenn</b> es regnet, <b>bleibe</b> ich zu Hause. Perfekt: …, weil ich gegangen <b>bin</b>. Separable verbs rejoin: …, weil er früh <b>aufsteht</b>.</p></div>
 <div class="card"><h3>zu + Infinitiv / um … zu</h3><table><tr><td>Ich habe keine Zeit, <b>zu</b> kochen.</td><td>zu before infinitive</td></tr><tr><td>Ich gehe ins Café, <b>um</b> Kaffee <b>zu</b> trinken.</td><td>in order to</td></tr><tr><td>Ich fange an, <b>aufzu</b>räumen.</td><td>separable: zu goes in the middle</td></tr></table><p class="note">No zu after modal verbs: Ich kann kochen.</p></div>
 <div class="card"><h3>Konjunktiv II — polite requests</h3><table><tr><th></th><th>haben</th><th>sein</th><th>werden</th><th>können</th></tr><tr><td>ich</td><td>hätte</td><td>wäre</td><td>würde</td><td>könnte</td></tr><tr><td>du</td><td>hättest</td><td>wärst</td><td>würdest</td><td>könntest</td></tr><tr><td>er/sie/es</td><td>hätte</td><td>wäre</td><td>würde</td><td>könnte</td></tr><tr><td>wir</td><td>hätten</td><td>wären</td><td>würden</td><td>könnten</td></tr><tr><td>ihr</td><td>hättet</td><td>wärt</td><td>würdet</td><td>könntet</td></tr><tr><td>sie/Sie</td><td>hätten</td><td>wären</td><td>würden</td><td>könnten</td></tr></table>
  <p class="note">Ich <b>hätte</b> gern einen Kaffee. · <b>Könnten</b> Sie mir helfen? · Ich <b>würde</b> gern bezahlen. · Das <b>wäre</b> alles.</p></div>`},
{id:"irr",label:"A2 · 47 unregelmäßig",title:"Top 47 unregelmäßige Verben",sub:"Your 47 Samurai list",html:"IRR"},
