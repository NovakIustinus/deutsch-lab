<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniels Deutsch-Hütte</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.hero{position:relative;height:min(78vw,430px);overflow:hidden;border-bottom:6px solid var(--blue2)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero img.me{position:absolute;left:50%;bottom:-2%;height:66%;transform:translateX(-50%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.hero .fg{position:absolute;left:0;bottom:0;width:100%;height:20%}
.title{position:absolute;top:36px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 3px 0 var(--blue2),0 0 12px rgba(0,0,0,.4)}
.title h1{margin:0;font-size:clamp(2rem,8vw,3.6rem);line-height:1}
.title p{margin:.2em 0 0;font-weight:800;letter-spacing:.08em;font-size:.95rem}
.bunting{position:absolute;top:0;left:0;width:100%;height:36px}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 50px}
h2{text-align:center;color:var(--blue2);font-size:1.9rem;margin:.2em 0 .6em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.mod{display:block;text-decoration:none;color:var(--ink);background:#fff;border:4px solid var(--blue2);border-radius:20px;padding:18px;
 box-shadow:0 7px 0 var(--blue2);transition:transform .12s;position:relative;overflow:hidden}
.mod:hover{transform:translateY(-3px) rotate(-.6deg)}
.mod:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue2)}
.mod .em{font-size:2.6rem}
.mod h3{margin:.2em 0;color:var(--red);font-size:1.4rem}
.mod p{margin:0 0 10px;font-size:.95rem;color:#445}
.mod .go{font-weight:800;color:var(--blue)}
.mod.soon{border-style:dashed;box-shadow:none;background:rgba(255,255,255,.6);text-align:center;color:#778}
.mod.soon:hover{transform:none}
footer{text-align:center;color:#667;font-size:.85rem;margin-top:34px}
</style></head>
<body>
<header class="hero">
<svg class="scene" viewBox="0 0 800 430" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
 <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a8be0"/><stop offset="1" stop-color="#bfe3ff"/></linearGradient>
  <g id="pine"><path d="M0-34 L11-14 H5 L14 2 H6 L17 20 H-17 L-6 2 H-14 L-5-14 H-11Z" fill="#1f5a2e"/><rect x="-3" y="20" width="6" height="8" fill="#5a3b1c"/></g>
  <pattern id="rhomb" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#fff"/><path d="M13 0 26 13 13 26 0 13Z" fill="#0b5cad"/></pattern>
 </defs>
 <rect width="800" height="430" fill="url(#sky)"/>
 <circle cx="665" cy="95" r="34" fill="#ffe27a"/>
 <g fill="#fff" opacity=".95"><ellipse cx="130" cy="95" rx="55" ry="17"/><ellipse cx="165" cy="82" rx="38" ry="16"/><ellipse cx="520" cy="70" rx="48" ry="14"/><ellipse cx="548" cy="58" rx="30" ry="13"/></g>
 <!-- far mountains -->
 <path d="M0 290 L110 160 L170 215 L260 110 L360 235 L450 150 L560 250 L650 130 L760 230 L800 200 V430 H0Z" fill="#8fa9c9"/>
 <path d="M260 110 L228 150 L252 142 L262 160 L282 140 L300 150Z M650 130 L622 168 L645 160 L656 176 L676 158 L690 166Z M110 160 L88 188 L106 182 L116 196 L134 180Z" fill="#fff"/>
 <!-- castle -->
 <g transform="translate(560 168)"><rect x="0" y="22" width="70" height="40" fill="#f4efe6"/><rect x="8" y="2" width="16" height="30" fill="#f4efe6"/><path d="M4 2 16-26 28 2Z" fill="#2f6fd6"/><rect x="44" y="10" width="14" height="22" fill="#f4efe6"/><path d="M41 10 51-14 61 10Z" fill="#2f6fd6"/><rect x="28" y="30" width="10" height="14" fill="#2f6fd6"/><path d="M-6 62 Q35 40 76 62Z" fill="#6f8f5a"/></g>
 <!-- near mountains -->
 <path d="M0 330 L90 240 L190 320 L300 215 L420 330 L520 260 L650 335 L740 270 L800 320 V430 H0Z" fill="#5f8f6a"/>
 <path d="M300 215 L272 250 L292 244 L302 260 L322 244 L338 252Z" fill="#fff"/>
 <g><use href="#pine" x="60" y="330"/><use href="#pine" x="95" y="345" transform="translate(0,0)"/><use href="#pine" x="140" y="335"/><use href="#pine" x="690" y="338"/><use href="#pine" x="730" y="350"/><use href="#pine" x="765" y="336"/><use href="#pine" x="30" y="352"/></g>
 <path d="M0 360 Q200 330 400 360 T800 350 V430 H0Z" fill="#79b45d"/>
 <!-- bunting -->
 <path d="M0 0 H800" stroke="#222" stroke-width="2"/>
</svg>
<svg class="bunting" viewBox="0 0 800 36" preserveAspectRatio="none" aria-hidden="true">
 <path d="M0 4 Q100 22 200 4 T400 4 T600 4 T800 4" stroke="#333" fill="none" stroke-width="2"/>
 <g id="flags"></g>
</svg>
<div class="title"><h1 class="fraktur">Daniels Deutsch-Hütte</h1><p>★ WILLKOMMEN · PROST · LERNEN ★</p></div>
<img class="me" src="assets/daniel.webp" alt="Daniel in Lederhosen mit einer Maß Bier vor den Alpen">
<svg class="fg" viewBox="0 0 800 80" preserveAspectRatio="none" aria-hidden="true">
 <path d="M0 30 Q200 0 400 28 T800 22 V80 H0Z" fill="#5da24a"/><path d="M0 52 Q250 28 500 50 T800 46 V80 H0Z" fill="#4a8a3c"/>
 <g fill="#fff"><circle cx="90" cy="48" r="5"/><circle cx="330" cy="58" r="5"/><circle cx="600" cy="50" r="5"/><circle cx="730" cy="62" r="5"/></g>
 <g fill="#f2b705"><circle cx="90" cy="48" r="2"/><circle cx="330" cy="58" r="2"/><circle cx="600" cy="50" r="2"/><circle cx="730" cy="62" r="2"/></g>
</svg>
</header>

<main class="wrap">
 <h2 class="fraktur">Wähle dein Modul</h2>
 <div class="grid" id="grid"></div>
 <footer>🥨 Gemacht mit Liebe und zu viel Bier · A1.2 · Berlin</footer>
</main>
<script src="modules.js"></script>
<script>
(function(){
  var g=document.getElementById("grid");
  window.MODULES.forEach(function(m){
    var a=document.createElement("a");a.className="mod";a.href=m.path;
    a.innerHTML='<div class="em">'+m.emoji+'</div><h3>'+m.title+'</h3><p>'+m.blurb+'</p><span class="go">Los geht’s →</span>';
    g.appendChild(a);
  });
  var s=document.createElement("div");s.className="mod soon";
  s.innerHTML='<div class="em">🔨</div><h3 style="color:#778">Bald mehr…</h3><p>Neue Module kommen, wenn dein Deutsch besser wird.</p>';
  g.appendChild(s);
  // bunting flags
  var f=document.getElementById("flags"),h="";
  for(var i=0;i<16;i++){var x=i*50+10,y=4+Math.sin(i*Math.PI/2)*0+ (i%4===0||i%4===2?9:(i%4===1||i%4===3?9:9));
    h+='<path d="M'+x+' '+(i%2?12:10)+' h30 l-15 22z" fill="'+(i%2?"#fff":"#0b5cad")+'" stroke="#0b5cad" stroke-width="1.5"/>';}
  f.innerHTML=h;
})();
</script>
</body></html>
